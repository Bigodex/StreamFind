<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StreamFind: descubra filmes e séries, veja sinopse, elenco, trailers e onde assistir.">
    <meta name="theme-color" content="#0B0B12">
    <title>StreamFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23555CFC'/><path d='M9 7l8 5-8 5z' fill='white'/></svg>">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header" id="header">
        <div class="header__inner">
            <a href="#/" class="logo" aria-label="StreamFind - Início">
                <span class="logo__mark"><i data-lucide="clapperboard"></i></span>
                <span class="logo__text">Stream<b>Find</b></span>
            </a>

            <nav class="nav" aria-label="Navegação principal">
                <a href="#/" class="nav__link" data-route="inicio"><i data-lucide="house"></i><span>Início</span></a>
                <a href="#/filmes" class="nav__link" data-route="filmes"><i data-lucide="film"></i><span>Filmes</span></a>
                <a href="#/series" class="nav__link" data-route="series"><i data-lucide="tv"></i><span>Séries</span></a>
                <a href="#/lista" class="nav__link" data-route="lista"><i data-lucide="bookmark"></i><span>Minha lista</span><em class="nav__badge" id="badge-lista" hidden>0</em></a>
            </nav>

            <form class="busca" id="form-busca" role="search" autocomplete="off">
                <i data-lucide="search" class="busca__icone"></i>
                <input type="search" id="campo-pesquisa" placeholder="Buscar filmes e séries…" aria-label="Buscar filmes e séries" aria-autocomplete="list" aria-controls="sugestoes">
                <kbd class="busca__atalho" title="Atalho: tecla /">/</kbd>
                <div class="sugestoes" id="sugestoes" role="listbox" hidden></div>
            </form>
        </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <!-- Navegação inferior (celular) -->
    <nav class="tabbar" aria-label="Navegação">
        <a href="#/" data-route="inicio"><i data-lucide="house"></i><span>Início</span></a>
        <a href="#/filmes" data-route="filmes"><i data-lucide="film"></i><span>Filmes</span></a>
        <a href="#/series" data-route="series"><i data-lucide="tv"></i><span>Séries</span></a>
        <a href="#/lista" data-route="lista"><i data-lucide="bookmark"></i><span>Lista</span></a>
    </nav>

    <!-- Detalhes do título -->
    <div class="modal" id="modal" hidden>
        <div class="modal__fundo" data-fechar></div>
        <article class="modal__painel" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <button class="modal__fechar" data-fechar aria-label="Fechar"><i data-lucide="x"></i></button>
            <div id="modal-conteudo"></div>
        </article>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="rodape">
        <div class="rodape__inner">
            <div>
                <a href="#/" class="logo logo--pequeno">
                    <span class="logo__mark"><i data-lucide="clapperboard"></i></span>
                    <span class="logo__text">Stream<b>Find</b></span>
                </a>
                <p>Descubra o que assistir e onde encontrar.</p>
            </div>
            <div class="rodape__fontes">
                <span>Dados fornecidos por</span>
                <a href="https://www.imdb.com" target="_blank" rel="noopener">IMDb</a>
                <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>
                <a href="https://pt.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a>
                <a href="https://www.apple.com/br/apple-tv-app/" target="_blank" rel="noopener">iTunes</a>
                <a href="https://www.justwatch.com/br" target="_blank" rel="noopener">JustWatch</a>
            </div>
            <div class="rodape__contato">
                <p>© <span id="ano"></span> StreamFind · ByMatchTech</p>
                <a href="mailto:pedropiola@matchtech.com"><i data-lucide="mail"></i>pedropiola@matchtech.com</a>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="dados.js"></script>
    <script src="app.js"></script>
</body>
</html>
